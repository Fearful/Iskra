# Dependabot configuration.
#
# The `bun` ecosystem reads the text lockfile (bun.lock) of the monorepo and of
# the docs site. Updates are grouped weekly so the lockfile changes in one PR;
# security updates are opened as soon as an advisory is published.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dependencies:
        update-types: ["minor", "patch"]

  - package-ecosystem: bun
    directory: /website
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      docs-site:
        update-types: ["minor", "patch"]
