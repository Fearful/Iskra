# Release workflow for the Iskra monorepo (Changesets-driven).
#
# On every push to `main`:
#
#   1. `version`: if there are pending changeset files, the Changesets action
#      opens (or updates) a "Version Packages" PR that consumes them: bumps
#      each affected @iskra-bun/* package, writes its CHANGELOG.md, and deletes
#      the changesets. Merging that PR is the human "cut a release" gate.
#
#   2. If there are NO pending changesets (the version PR was just merged):
#      `build` builds every package to `dist/` and rewrites `workspace:`
#      dependency ranges to real versions (scripts/pin-workspace-deps.ts; npm
#      publish does not understand the protocol), then `publish` runs
#      `changeset publish`, which publishes each public package to npm with a
#      provenance attestation (publishConfig.provenance), and creates the
#      matching GitHub Releases.
#
# The jobs are split so that the code that builds the packages (the whole
# toolchain and its dependencies) never runs next to a credential: `build` has
# a read-only token and no secrets, and the jobs that hold the npm token, the
# OIDC permission or a write token install dependencies without running their
# install scripts and run only the Changesets CLI. A compromised build
# dependency could otherwise publish trojaned packages or push to the repo.
#
# Versions and changelogs are therefore never hand-edited; they flow from the
# changeset files contributors add (see CONTRIBUTING.md / VERSIONING.md).
name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Version PR
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version branch
      pull-requests: write # open/update the "Version Packages" PR
    outputs:
      hasChangesets: ${{ steps.changesets.outputs.hasChangesets }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # Only the Changesets CLI and scripts/sync.ts run here: no install scripts.
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # Without a `publish` input the action only manages the version PR; it
      # reports whether changesets are pending so `build`/`publish` can run.
      - name: Create or update the version PR
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version: bun run version # `changeset version` — bumps + writes CHANGELOGs
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build packages
    needs: version
    if: needs.version.outputs.hasChangesets == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and pin workspace dependencies
        run: |
          bun run build
          bun run scripts/pin-workspace-deps.ts
          tar -czf release-build.tgz packages/*/dist packages/*/package.json

      - name: Upload the built packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-build
          path: release-build.tgz
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    # Create this environment in the repository settings to require an
    # approval before publishing, and to scope NPM_TOKEN (or npm trusted
    # publishing) to this job.
    environment: npm
    permissions:
      contents: write # create GitHub Releases and push the release tags
      id-token: write # npm provenance attestations / trusted publishing

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # npm (not bun) performs the actual publish: `npm publish --provenance`
      # (enabled below via NPM_CONFIG_PROVENANCE) is the supported provenance path.
      - name: Setup Node (for npm publish + provenance)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing (OIDC, no long-lived npm token) needs npm >= 11.5.1;
      # Node 22 ships npm 10.
      - name: Update npm
        run: npm install -g npm@^11.5.1

      # For the Changesets CLI only; the packages were built by `build`. Before
      # unpacking: the pinned manifests no longer match the lockfile.
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Download the built packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-build

      - name: Unpack the built packages
        run: tar -xzf release-build.tgz && rm release-build.tgz

      - name: Publish
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish: bunx changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only needed until every package has this workflow configured as its
          # trusted publisher on npmjs.com (see VERSIONING.md); then delete the
          # NPM_TOKEN secret and npm authenticates with the job's OIDC token.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Every package also sets publishConfig.provenance.
          NPM_CONFIG_PROVENANCE: "true"
