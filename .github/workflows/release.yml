# Release workflow for the Iskra monorepo (Changesets-driven).
#
# On every push to `main`, the Changesets action does one of two things:
#
#   1. If there are pending changeset files, it opens (or updates) a
#      "Version Packages" PR that consumes them: bumps each affected
#      @iskra-bun/* package, writes its CHANGELOG.md, and deletes the
#      changesets. Merging that PR is the human "cut a release" gate.
#
#   2. If there are NO pending changesets (i.e. the version PR was just
#      merged), it runs the `release` script — which builds every package
#      to `dist/` and then `changeset publish`es each public package to npm
#      with provenance, and creates the matching GitHub Releases.
#
# Versions and changelogs are therefore never hand-edited; they flow from the
# changeset files contributors add (see CONTRIBUTING.md / VERSIONING.md).
name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # create GitHub Releases + push the version PR
  pull-requests: write # open/update the "Version Packages" PR
  id-token: write # npm provenance attestations

jobs:
  release:
    name: Version PR or publish to npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # npm (not bun) performs the actual publish: `npm publish --provenance`
      # (enabled below via NPM_CONFIG_PROVENANCE) is the supported provenance path.
      - name: Setup Node (for npm publish + provenance)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create Version PR or publish
        uses: changesets/action@v1
        with:
          version: bun run version # `changeset version` — bumps + writes CHANGELOGs
          publish: bun run release # `bun run build && changeset publish`
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
