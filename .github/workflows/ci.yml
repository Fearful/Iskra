# Continuous Integration for the Iskra monorepo.
#
# Runs on every pull request and on pushes to `main`. Installs with a frozen
# lockfile, then runs lint, typecheck and the full test suite with coverage.
#
# Service containers (Redis / Postgres / MySQL) are wired so the integration
# tests that are skipped locally (they probe TEST_REDIS_URL / TEST_PG_URL /
# TEST_MYSQL_URL for reachability) un-skip in CI. The credentials below match
# the defaults baked into those test files exactly:
#   - packages/web-kit/test/cache.integration.test.ts        (TEST_REDIS_URL)
#   - packages/web-kit/test/session-db.test.ts               (TEST_PG_URL, TEST_MYSQL_URL)
#   - packages/db-kit/test/connections.integration.test.ts   (TEST_PG_URL, TEST_MYSQL_URL)
#   - packages/worker-kit/test/worker.integration.test.ts    (TEST_REDIS_URL)
#   - packages/kv-kit/test/kv.integration.test.ts            (TEST_REDIS_URL)
#   - templates/forms-app/services/*/test/*                  (TEST_REDIS_URL, TEST_PG_URL)
name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: mysql
          MYSQL_DATABASE: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pmysql"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Must match the defaults in the integration test files so the gated
      # describe() blocks detect reachable services and un-skip.
      TEST_REDIS_URL: redis://127.0.0.1:6379
      TEST_PG_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      TEST_MYSQL_URL: mysql://root:mysql@127.0.0.1:3306/test

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Test with coverage
        run: bun test --coverage --coverage-reporter=lcov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          files: ./coverage/lcov.info
          # Informational only for now: a failed upload must not fail CI.
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # The Python and Java SDKs against the real contract server
  # (sdks/contract/server.ts), which each suite starts with Bun; plus a build
  # of the Spring MVC example and a syntax check of the FastAPI one.
  sdks:
    name: SDK contract tests (Python, Java)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Python SDK
        working-directory: sdks/python/iskra-client
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest
          python -m compileall -q examples

      - name: Java SDK
        working-directory: sdks/java/iskra-client
        run: mvn -B install

      - name: Java Spring MVC example
        working-directory: sdks/java/iskra-client/examples/mvc-auth
        run: mvn -B -DskipTests package

  # Dependency vulnerability (CVE) gate: google/osv-scanner reads the
  # committed text lockfile (bun.lock) natively and queries osv.dev for known
  # CVEs in the resolved third-party dependencies. Accepted findings (with a
  # reason and an expiry) live in osv-scanner.toml. Independent of the test job,
  # so a finding is surfaced without blocking or being blocked by tests; a
  # vulnerability match exits non-zero and fails the job.
  audit:
    name: Dependency audit (CVE gate)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The binary is checked against the SHA-256 published with the release
      # (osv-scanner_SHA256SUMS) before it runs.
      - name: Install osv-scanner
        env:
          OSV_SCANNER_SHA256: 03d800073a330d053047b26ff4484136d866aee4f486e12fb82aa452bd4002ca
        run: |
          curl -sSfL \
            "https://github.com/google/osv-scanner/releases/download/v2.3.2/osv-scanner_linux_amd64" \
            -o osv-scanner
          echo "$OSV_SCANNER_SHA256  osv-scanner" | sha256sum -c -
          install -m 0755 osv-scanner /usr/local/bin/osv-scanner
          rm osv-scanner
          osv-scanner --version

      - name: Scan dependencies for known CVEs (osv-scanner)
        # The SDKs' Maven and pip manifests too: their dependencies (Jackson,
        # Spring, httpx) were never scanned.
        run: >-
          osv-scanner scan --config=osv-scanner.toml
          --lockfile=bun.lock --lockfile=website/bun.lock
          --lockfile=pom.xml:sdks/java/iskra-client/pom.xml
          --lockfile=pom.xml:sdks/java/iskra-client/examples/mvc-auth/pom.xml
          --lockfile=requirements.txt:sdks/python/iskra-client/examples/fastapi-auth/requirements.txt

  # Secret scanning: gitleaks over the whole history and the working tree, with
  # the allowlist in .gitleaks.toml (test fixtures and documented placeholders).
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # Checked against the SHA-256 in the release's gitleaks_8.30.1_checksums.txt.
      - name: Install gitleaks
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            -o gitleaks.tar.gz
          echo "$GITLEAKS_SHA256  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm gitleaks gitleaks.tar.gz
          gitleaks version

      - name: Scan the history for secrets
        run: gitleaks git --config .gitleaks.toml --redact --no-banner .

      - name: Scan the working tree for secrets
        run: gitleaks dir --config .gitleaks.toml --redact --no-banner .
