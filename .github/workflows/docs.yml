name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'packages/**'
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Allow only one concurrent deployment, skipping runs queued between the
# run in-progress and latest queued.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.1.38'

      - name: Install website dependencies
        working-directory: website
        run: bun install --frozen-lockfile

      - name: Generate API reference (TypeDoc)
        working-directory: website
        run: bun run api

      - name: Build site
        working-directory: website
        run: bun run build

      # Stage the built site under a directory matching the `/iskra` base path so
      # lychee can resolve the root-relative links Starlight emits (e.g.
      # `/iskra/getting-started/`). `--root-dir` then maps `/` to `_linkcheck`.
      - name: Stage site for link check
        run: |
          rm -rf _linkcheck
          mkdir -p _linkcheck/iskra
          cp -R website/dist/. _linkcheck/iskra/

      - name: Link check (lychee)
        uses: lycheeverse/lychee-action@v2
        with:
          # Offline: check internal links only. External links (npm, GitHub,
          # Codeberg) are validated elsewhere and would make docs deploys flaky.
          args: >-
            --offline
            --no-progress
            --root-dir ${{ github.workspace }}/_linkcheck
            '_linkcheck/iskra/**/*.html'
          fail: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
