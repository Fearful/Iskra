name: Docs

# Build the documentation site and deploy it to Fly.io on every push to `main`
# that touches the docs, the site, or package sources (TypeDoc reads them).
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'packages/**'
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

concurrency:
  group: deploy-docs
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    # A manual run from another branch would deploy it over the public docs.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # Astro 7 needs Node >= 22.12 (its CLI runs on node, even via bun run).
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install website dependencies
        working-directory: website
        run: bun install --frozen-lockfile

      - name: Generate API reference (TypeDoc)
        working-directory: website
        run: bun run api

      - name: Build site
        working-directory: website
        run: bun run build

      # The site serves from "/", so root-relative links resolve directly
      # against the dist root. Offline = internal links only (external links are
      # checked elsewhere and would make deploys flaky).
      - name: Link check (lychee)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline
            --no-progress
            --root-dir ${{ github.workspace }}/website/dist
            'website/dist/**/*.html'
          fail: true

      - name: Setup flyctl
        # Pinned: @master ran whatever that branch held, with the deploy token.
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6

      - name: Deploy to Fly.io
        run: flyctl deploy ./website --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
