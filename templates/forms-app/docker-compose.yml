# Every secret comes from the environment or a .env next to this file (see
# .env.example). None has a default: `docker compose` refuses to start without
# them, where it used to run with values anyone could read here.
#
# Each service joins only the networks of what it talks to (see `networks` at
# the end): forms-api, the public service, reaches nginx and Redis and nothing
# else, neither Postgres nor form-manager. Everything used to share one network.
services:
  # ─── Infrastructure ──────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - public
      - admin
    depends_on:
      - forms-api
      - admin-frontend
      - admin-api

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: forms_app
      POSTGRES_USER: forms
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set it in .env, see .env.example}
    # Loopback only, for create-admin and `bun dev` on this machine: it used to
    # be published on every interface. Remove it where nothing needs it.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the tables on the first start of an empty volume.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forms -d forms_app"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    # Redis used to accept anyone who reached it: with the schemas forms-api
    # validates against and the answer queue in it, a password is required.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set it in .env, see .env.example}"]
    environment:
      # redis-cli's password, for the healthcheck.
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set it in .env, see .env.example}
    # Loopback only, like Postgres.
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - public-redis
      - redis
    healthcheck:
      # redis-cli exits 0 on an error reply (NOAUTH) too.
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── Admin Zone ──────────────────────────────────────────────────────────────
  admin-api:
    build:
      context: ../..
      dockerfile: templates/forms-app/services/admin-api/Dockerfile
    environment:
      PORT: "4000"
      DATABASE_URL: postgresql://forms:${DB_PASSWORD:?set it in .env, see .env.example}@postgres:5432/forms_app
      AUTH_SECRET: ${AUTH_SECRET:?set it in .env, see .env.example}
      # Origin only: a path here would move better-auth's routes off /api/auth.
      AUTH_BASE_URL: http://localhost
      CORS_ORIGINS: http://localhost
      FORM_MANAGER_URL: http://form-manager:4001
      # admin-api and cron send it; form-manager's /internal API requires it.
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set it in .env, see .env.example}
    networks:
      - admin
      - db
      - control
    depends_on:
      postgres:
        condition: service_healthy

  admin-frontend:
    build:
      context: ../..
      dockerfile: templates/forms-app/services/admin-frontend/Dockerfile
    networks:
      - admin
    depends_on:
      - admin-api

  # ─── Intranet Services ──────────────────────────────────────────────────────
  form-manager:
    build:
      context: ../..
      dockerfile: templates/forms-app/services/form-manager/Dockerfile
    environment:
      PORT: "4001"
      DATABASE_URL: postgresql://forms:${DB_PASSWORD:?set it in .env, see .env.example}@postgres:5432/forms_app
      REDIS_URL: redis://:${REDIS_PASSWORD:?set it in .env, see .env.example}@redis:6379
      STATIC_DIR: /app/static
      RECAPTCHA_SITE_KEY: ${RECAPTCHA_SITE_KEY:-your-site-key}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set it in .env, see .env.example}
    volumes:
      - static-forms:/app/static
    networks:
      - control
      - db
      - redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  cron:
    build:
      context: ../..
      dockerfile: templates/forms-app/services/cron/Dockerfile
    environment:
      PORT: "4002"
      DATABASE_URL: postgresql://forms:${DB_PASSWORD:?set it in .env, see .env.example}@postgres:5432/forms_app
      REDIS_URL: redis://:${REDIS_PASSWORD:?set it in .env, see .env.example}@redis:6379
      FORM_MANAGER_URL: http://form-manager:4001
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set it in .env, see .env.example}
      CHECK_INTERVAL_MS: "30000"
    networks:
      - control
      - db
      - redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      form-manager:
        condition: service_started

  # ─── Public Zone ─────────────────────────────────────────────────────────────
  forms-api:
    build:
      context: ../..
      dockerfile: templates/forms-app/services/forms-api/Dockerfile
    environment:
      PORT: "3000"
      REDIS_URL: redis://:${REDIS_PASSWORD:?set it in .env, see .env.example}@redis:6379
      RECAPTCHA_SECRET: ${RECAPTCHA_SECRET:?set it in .env, see .env.example}
      RECAPTCHA_MIN_SCORE: "0.5"
      # Hostnames of the form pages, comma-separated: tokens from other sites
      # that use the same keys are refused. Empty: any hostname.
      RECAPTCHA_HOSTNAMES: ${RECAPTCHA_HOSTNAMES:-}
      CSRF_SECRET: ${CSRF_SECRET:?set it in .env, see .env.example}
      IP_HASH_SECRET: ${IP_HASH_SECRET:?set it in .env, see .env.example}
      # Behind nginx: the client IP is its X-Forwarded-For entry.
      TRUST_PROXY: "1"
      STATIC_DIR: /app/static
    volumes:
      - static-forms:/app/static:ro
    networks:
      - public
      - public-redis
    depends_on:
      redis:
        condition: service_healthy
    # NOTE: No postgres dependency — Redis-only

  # ─── Answer Processing ──────────────────────────────────────────────────────
  answer-writer:
    build:
      context: ../..
      dockerfile: templates/forms-app/services/answer-writer/Dockerfile
    environment:
      DATABASE_URL: postgresql://forms:${DB_PASSWORD:?set it in .env, see .env.example}@postgres:5432/forms_app
      REDIS_URL: redis://:${REDIS_PASSWORD:?set it in .env, see .env.example}@redis:6379
      WORKER_CONCURRENCY: "50"
      BATCH_MAX_SIZE: "50"
      BATCH_FLUSH_INTERVAL_MS: "2000"
    networks:
      - db
      - redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: 2

networks:
  # nginx ↔ forms-api (the DMZ).
  public:
  # nginx ↔ admin-api and admin-frontend.
  admin:
  # forms-api ↔ Redis, and nothing else.
  public-redis:
  # Redis ↔ the intranet services.
  redis:
  # Postgres ↔ the services that query it.
  db:
  # admin-api and cron → form-manager's /internal API.
  control:

volumes:
  pgdata:
  static-forms:
